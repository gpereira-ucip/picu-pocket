<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carga Mental</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5440">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4efe8;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e6ddd2;--pri:#7c5440;--pri2:#f3e4d8;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--ok:#15803d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 14px calc(10px);background:var(--pri);color:#fff}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#splash{position:fixed;inset:0;z-index:50;background:#e5e2db;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash img{width:min(78vw,420px);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#splash p{color:#6b5146;font-size:13px;margin-top:16px;letter-spacing:.3px}
#splash.out{opacity:0;pointer-events:none}
.welcome img{display:block;width:62%;max-width:260px;margin:0 auto 10px;border-radius:12px}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.8}
#who{border:0;border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:600}
.sync{font-size:12px;text-align:center;padding:4px;color:var(--mut)}
main{padding:8px 12px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font:inherit;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
h2{font-size:17px;margin:14px 2px 4px}
h3{font-size:15px;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--mut);font-size:13px;margin:4px 0}
.sub{color:var(--mut);font-size:12px;margin:2px 0 6px}
.p{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;border:0;font-family:inherit}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;background:var(--pri2);color:var(--pri)}
.tag.w{background:var(--warnbg);color:var(--warn)}
.tag.b{background:var(--badbg);color:var(--bad)}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item .t div:first-child{font-weight:600}
.item .meta{font-size:12px;color:var(--mut)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
button.b,.btns button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font:inherit;font-size:13px;color:var(--ink)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.sm{padding:4px 9px;font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
details summary{cursor:pointer;color:var(--pri);font-size:13px;font-weight:600;padding:6px 0}
.steps{display:flex;gap:6px;margin-top:8px}
.steps button{flex:1;border:1.5px dashed var(--line);border-radius:10px;background:#fff;padding:8px 4px;font:inherit;font-size:12px;line-height:1.2}
.steps button.done{border:1.5px solid var(--ok);background:#f0fdf4;color:var(--ok)}
.steps button.next{border:1.5px solid var(--pri);background:var(--pri2);font-weight:700}
.steps small{display:block;font-size:10px;color:var(--mut);font-weight:400}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;background:#fff}
.day.today{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri2)}
.day b{display:block;font-size:13px}
.day .p{display:block;margin:3px auto;padding:2px 4px;font-size:11px;width:100%}
.day .lbl{color:var(--mut);font-size:10px;margin-top:4px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri)}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;padding:7px 11px;border-radius:14px;background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--pri2);border-color:#e3c9b6}
.msg .meta{font-size:11px;color:var(--mut)}
.composer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:8px 12px;background:var(--bg);border-top:1px solid var(--line);max-width:720px;margin:0 auto}
.composer input{flex:1}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:12px}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90%}
#toast.on{opacity:.95}
.log{font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.big{font-size:22px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.credit{text-align:center;color:var(--mut);font-size:12px;margin:18px 0}
.newsv{border-top:1px solid var(--line);padding:10px 0 4px}
.newsv:first-of-type{border-top:0}
.newsv h4{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.newsv h4 span{font-weight:400;color:var(--mut);font-size:12px}
.newsv ul{margin:4px 0 6px;padding-left:20px}
.newsv li{margin:3px 0;font-size:14px}
.newsv.cur{background:var(--pri2);border-radius:12px;padding:10px 12px;border-top:0}
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.prog .bar{flex:1;height:12px;margin:0}
.prog b{font-size:20px;color:var(--pri);white-space:nowrap}
.verlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;margin:10px 0;font:inherit;color:var(--ink)}
.verlink .bar{flex:1;margin:0}
.verlink small{color:var(--mut);font-size:12px;white-space:nowrap}
.install{border-color:var(--pri);background:var(--pri2)}
.howto{padding-left:22px;margin:6px 0}
.howto li{margin:6px 0}
</style>
</head>
<body>
<div id="splash" onclick="this.classList.add('out')"><img src="cover.jpg" alt="Carga Mental"><p>Compartida, no invisible</p></div>
<header>
  <div class="brand"><img src="icon-192.png" alt=""><div>Carga Mental<small>Compartida, no invisible</small></div></div>
  <button id="who" onclick="A.settings()">⚙</button>
</header>
<div id="sync" class="sync"></div>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)A.close()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ Constantes ============ */
const VERSION = '1.1.0';
const SCHEMA = 1; // versión de la estructura de datos guardados (ver MIGRATIONS)
/* Novedades: la primera es la versión actual. "hechas" = ítems del plan de 100 tildados hasta esa versión. */
const NEWS = [
  {v:'1.1.0', d:'2026-11-09', hechas:5, items:[
    'Nueva pantalla de Novedades y progreso: muestra qué cambió y cuántas de las 100 mejoras ya están hechas. Se abre sola cuando hay una versión nueva.',
    'Tus datos quedan protegidos al actualizar: la app guarda una copia antes de adaptar la información a la versión nueva.',
    'Botón «Instalar app» y guía paso a paso para Android.',
    'Accesos directos: dejá apretado el ícono del camión para ir directo a «Anotar compra», «Mensajes» u «Hoy».',
    'Pruebas automáticas más completas antes de cada publicación.'
  ]},
  {v:'1.0.0', d:'2026-11-09', hechas:0, items:[
    'Primera versión: compras por negocio con alertas, tareas por etapas, semana de Joaco según las guardias, mochila, salud, indicaciones para Daniela y mensajes.',
    'Portada e ícono con el camión de la carga mental.',
    'Plan de 100 mejoras, que se van sumando día a día.'
  ]}
];
const DAY = 86400000;
const COLS = ['stores','items','tasks','checks','salud','indic','areas','msgs','weeks','log'];
const M = {
  gonzalo:{n:'Gonzalo', r:'Papá', c:'#2563eb'},
  dani:{n:'Dani', r:'Mamá · Daniela, esposa', c:'#db2777'},
  daniela:{n:'Daniela', r:'Empleada de limpieza', c:'#059669'},
  joaco:{n:'Joaco', r:'Hijo · Joaquín, 10 años', c:'#d97706'},
  abuelos:{n:'Abuelos', r:'Buscan a Joaco los lunes', c:'#7c3aed'},
  ambos:{n:'Ambos', r:'Gonzalo y Dani', c:'#64748b'}
};
const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DOWL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2,'0');
const dk = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDk = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
function monday(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function ago(ts){
  if(!ts) return 'sin registro';
  const m = Math.round((Date.now()-ts)/60000);
  if(m < 1) return 'recién'; if(m < 60) return `hace ${m} min`;
  const h = Math.round(m/60); if(h < 24) return `hace ${h} h`;
  const d = Math.round(h/24); return d === 1 ? 'ayer' : `hace ${d} días`;
}
function fdate(s){ if(!s) return ''; const d = parseDk(s); return `${DOW[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`; }
function daysTo(s){ return Math.round((parseDk(s) - parseDk(dk()))/DAY); }
const P = (id, extra='') => { const m = M[id] || {n:id, c:'#9ca3af'}; return `<span class="p" style="background:${m.c}" ${extra}>${esc(m.n)}</span>`; };
const PB = (id, onclick) => { const m = M[id] || {n:id, c:'#9ca3af'}; return `<button class="p" style="background:${m.c}" onclick="${onclick}">${esc(m.n)} ⟳</button>`; };
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); }

/* ============ Datos iniciales ============ */
function seed(){
  const S = {}; COLS.forEach(c => S[c] = {});
  const add = (c, o) => S[c][o.id] = o;
  [
    {id:'naturista', name:'Naturista', icon:'🌰', how:'Negocio de cercanía', owner:'gonzalo', ord:1},
    {id:'verduleria', name:'Verdulería', icon:'🥬', how:'Varias veces por semana', owner:'ambos', ord:2},
    {id:'super', name:'Supermercado', icon:'🛒', how:'Pedido online semanal', owner:'gonzalo', ord:3},
    {id:'ml', name:'MercadoLibre', icon:'📦', how:'Pedido online', owner:'gonzalo', ord:4},
    {id:'berardi', name:'Berardi (pescados)', icon:'🐟', how:'Pedido por la web', owner:'gonzalo', ord:5}
  ].forEach(s => add('stores', s));
  const it = (id, name, store, every) => add('items', {id:'i_'+id, name, store, every, last:null, state:'ok'});
  it('semillas','Semillas','naturista',14); it('frutos','Frutos secos','naturista',14);
  it('snacks','Snacks de Joaco','naturista',7); it('huevos','Huevos (gallinas alimentadas a maíz)','naturista',7);
  it('frutas','Frutas','verduleria',3); it('verduras','Verduras','verduleria',3);
  it('agua','Agua','super',7); it('soda','Soda','super',7); it('atun','Latas de atún','super',14);
  it('limpieza','Artículos de limpieza','super',14); it('papcocina','Papel de cocina','super',10);
  it('higienico','Papel higiénico','super',10); it('panuelos','Pañuelos descartables','super',14);
  it('pastillas','Pastillas para el lavavajillas','super',21); it('jabonropa','Jabón para la ropa','super',21);
  it('yerba','Yerba','ml',21); it('pescado','Pescado','berardi',14);

  add('tasks', {id:'t_lava', kind:'cycle', name:'Lavavajillas', icon:'🍽️', owner:'gonzalo', steps:['Cargar','Encender','Guardar'], cur:{}, lastDone:null, ord:1});
  add('tasks', {id:'t_ropa', kind:'cycle', name:'Ropa', icon:'👕', owner:'ambos', steps:['Lavar','Colgar','Doblar','Guardar'], cur:{}, lastDone:null, ord:2});
  add('tasks', {id:'t_orden', kind:'rec', name:'Orden general (cocina y living)', icon:'🧺', owner:'ambos', every:1, last:null, ord:3});
  add('tasks', {id:'t_riego', kind:'rec', name:'Regar el limonero', icon:'🍋', owner:'gonzalo', every:3, last:null, ord:4});
  add('tasks', {id:'t_fert', kind:'rec', name:'Fertilizar el limonero', icon:'🍋', owner:'gonzalo', every:45, last:null, ord:5});

  add('checks', {id:'mochila', date:'', done:{}, list:['Carpetas y cuadernos del día','Cartuchera','Snack','Botella de agua','Tarea hecha','Comunicados firmados','Ropa de mañana preparada']});
  add('checks', {id:'daniela', next:'', hours:'', coord:'dani', note:'Viene 1 vez por semana (a veces 2, una más corta).'});

  const sa = (id, name, every, note='') => add('salud', {id:'s_'+id, name, every, last:'', next:'', owner:'gonzalo', note});
  sa('pedia','Control pediátrico',365); sa('odonto','Odontología',180); sa('oftalmo','Oftalmología',365);
  sa('vacunas','Vacunas',0,'Próximas: calendario de los 11 años');

  const ar = (id, name, owner) => add('areas', {id:'a_'+id, name, owner});
  ar('online','Compras online (súper, MercadoLibre, Berardi)','gonzalo');
  ar('cercania','Verdulería y naturista','ambos');
  ar('stock','Revisar qué falta en la despensa','gonzalo');
  ar('lava','Lavavajillas de punta a punta','gonzalo');
  ar('ropa','Ropa de la casa','ambos');
  ar('orden','Orden general','ambos');
  ar('limon','Limonero','gonzalo');
  ar('mochila','Mochila, ropa y snacks de Joaco','ambos');
  ar('escuela','Llevar y buscar a Joaco','ambos');
  ar('salud','Turnos médicos y odontología de Joaco','gonzalo');
  ar('daniela','Indicaciones a Daniela','dani');

  add('weeks', {id:'base', days:{
    1:{lleva:'gonzalo', busca:'abuelos'},
    2:{lleva:'dani', busca:'gonzalo'},
    3:{lleva:'gonzalo', busca:'gonzalo'},
    4:{lleva:'gonzalo', busca:'gonzalo'},
    5:{lleva:'dani', busca:'dani'}
  }});
  return S;
}

/* ============ Estado + persistencia local ============ */
const LS = {data:'cm_data', me:'cm_me', cfg:'cm_fb', code:'cm_code', tab:'cm_tab', seen:'cm_seen', noInst:'cm_noinst'};
/* Migraciones: cada número lleva los datos de la versión anterior a esa. Nunca borran nada:
   solo completan lo que falta. Antes de migrar se guarda una copia en cm_backup_v{n}. */
const MIGRATIONS = {
  1(D){ // v1.0.0 (sin número de esquema) → esquema 1
    COLS.forEach(c => { if(!D[c] || typeof D[c] !== 'object') D[c] = {}; });
    const b = seed();
    ['mochila','daniela'].forEach(k => { if(!D.checks[k]) D.checks[k] = b.checks[k]; });
    const mo = D.checks.mochila; if(!Array.isArray(mo.list)) mo.list = b.checks.mochila.list; if(!mo.done || typeof mo.done !== 'object') mo.done = {}; if(mo.date == null) mo.date = '';
    if(!D.weeks.base || !D.weeks.base.days) D.weeks.base = b.weeks.base;
    [1,2,3,4,5].forEach(x => { if(!D.weeks.base.days[x]) D.weeks.base.days[x] = b.weeks.base.days[x]; });
    if(!Object.keys(D.stores).length) D.stores = b.stores;
    Object.values(D.items).forEach(i => { if(!i.state) i.state = 'ok'; if(!(i.every > 0)) i.every = 7; if(!D.stores[i.store]) i.store = Object.keys(D.stores)[0]; });
    Object.values(D.tasks).forEach(t => { if(!t.kind) t.kind = t.steps ? 'cycle' : 'rec'; if(t.kind === 'cycle'){ if(!Array.isArray(t.steps)) t.steps = ['Hacer']; if(!t.cur) t.cur = {}; } else if(!(t.every > 0)) t.every = 7; if(!t.owner) t.owner = 'ambos'; });
    Object.values(D.indic).forEach(n => { if(!n.kind) n.kind = 'tarea'; });
  }
};
function migrate(D){
  const from = +D._v || 0; if(from >= SCHEMA) return false;
  try { localStorage.setItem('cm_backup_v' + from, JSON.stringify(D)); } catch(e) {}
  for(let v = from + 1; v <= SCHEMA; v++) MIGRATIONS[v](D);
  D._v = SCHEMA; return true;
}
let S;
try { S = JSON.parse(localStorage.getItem(LS.data)); } catch(e) {}
let fresh = false;
if(!S || typeof S !== 'object'){ S = seed(); S._v = SCHEMA; fresh = true; }
COLS.forEach(c => S[c] = S[c] || {});
if(migrate(S) || fresh) try { localStorage.setItem(LS.data, JSON.stringify(S)); } catch(e) {}
let me = localStorage.getItem(LS.me) || '';
let tab = localStorage.getItem(LS.tab) || 'hoy';
let storeFilter = 'todos';
let weekOffset = 0;
function save(){ try { localStorage.setItem(LS.data, JSON.stringify(S)); } catch(e) {} }
const clean = o => JSON.parse(JSON.stringify(o));

/* ============ Sincronización (Firebase, opcional) ============ */
let fs = null, syncState = 'local';
const FBV = '10.12.2';
const remotePath = col => fs.collection('hogares').doc(localStorage.getItem(LS.code)).collection(col);

function put(col, obj, act){
  obj.at = Date.now(); obj.by = me;
  S[col][obj.id] = obj; save();
  if(fs) remotePath(col).doc(obj.id).set(clean(obj)).catch(e => console.warn(e));
  if(act) logAct(act);
  render();
}
function del(col, id, act){
  delete S[col][id]; save();
  if(fs) remotePath(col).doc(id).delete().catch(e => console.warn(e));
  if(act) logAct(act);
  render();
}
function logAct(act){
  const o = {id:uid(), at:Date.now(), by:me, act};
  S.log[o.id] = o;
  const ids = Object.values(S.log).sort((a,b) => b.at - a.at).slice(150).map(x => x.id);
  ids.forEach(i => delete S.log[i]);
  save();
  if(fs) remotePath('log').doc(o.id).set(o).catch(()=>{});
}
function loadScript(src){ return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
function parseCfg(txt){
  const m = String(txt).match(/\{[\s\S]*\}/); if(!m) throw new Error('No encontré la configuración');
  let j = m[0].replace(/\/\/.*$/gm,'').replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}');
  const c = JSON.parse(j); if(!c.apiKey || !c.projectId) throw new Error('Falta apiKey o projectId'); return c;
}
async function connect(){
  const raw = localStorage.getItem(LS.cfg), code = localStorage.getItem(LS.code);
  if(!raw || !code) { syncState = 'local'; renderSync(); return; }
  syncState = 'conectando'; renderSync();
  try{
    const cfg = JSON.parse(raw);
    for(const p of ['app','auth','firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${p}-compat.js`);
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    await firebase.auth().signInAnonymously();
    const db = firebase.firestore();
    try { await db.enablePersistence({synchronizeTabs:true}); } catch(e) {}
    fs = db;
    for(const col of COLS){
      // Primera vez: si la nube está vacía subo lo local; si no, la nube manda.
      let snap = null;
      try { snap = await remotePath(col).get({source:'server'}); } catch(e) {}
      if(snap){
        if(snap.empty){ if(col !== 'log') Object.values(S[col]).forEach(o => remotePath(col).doc(o.id).set(clean(o))); }
        else { S[col] = {}; snap.forEach(d => S[col][d.id] = d.data()); }
      }
      let first = true;
      remotePath(col).onSnapshot(sn => {
        sn.docChanges().forEach(ch => {
          if(ch.type === 'removed'){ delete S[col][ch.doc.id]; return; }
          const d = ch.doc.data(); S[col][ch.doc.id] = d;
          if(!first && !ch.doc.metadata.hasPendingWrites && d.by && d.by !== me){
            if(col === 'log') notify(`${M[d.by]?.n || d.by}`, d.act);
            if(col === 'msgs') notify(`💬 ${M[d.by]?.n || d.by}`, d.text);
          }
        });
        first = false; save(); render();
      }, e => { syncState = 'error'; renderSync(); console.warn(e); });
    }
    MIGRATIONS[1](S); syncState = 'nube'; save(); render();
  }catch(e){ console.warn(e); syncState = 'error'; renderSync(); }
}
async function notify(title, body){
  if(document.visibilityState === 'visible'){ toast(`${title}: ${body}`); return; }
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  try { const r = await navigator.serviceWorker.ready; r.showNotification(title, {body, icon:'icon-192.png', badge:'icon-192.png', tag:'cm-'+Date.now()}); }
  catch(e) { new Notification(title, {body}); }
}
function renderSync(){
  const t = {local:'📱 Solo en este teléfono · conectá la nube en ⚙', conectando:'⏳ Conectando…', nube:'☁️ Sincronizado con la familia', error:'⚠️ Error de sincronización · revisá ⚙'}[syncState];
  $('#sync').textContent = navigator.onLine || syncState === 'local' ? t : '📴 Sin conexión · se sincroniza al volver';
}

const recDue = t => !t.last || (Date.now() - t.last) >= t.every * DAY;
const mine = owner => owner === me || (owner === 'ambos' && (me === 'gonzalo' || me === 'dani'));

function weekCfg(mon){
  const id = 'w-' + dk(mon);
  return S.weeks[id] || {id, tueNight:false, office:[4], over:{}};
}
function avail(p, dow, w){
  if(p === 'gonzalo') return {am: !(dow === 2 || dow === 5 || (dow === 3 && w.tueNight)), pm: !(dow === 1 || dow === 5)};
  if(p === 'dani') return {am:true, pm: !(dow === 1 || dow === 3)};
  return {am:true, pm:true};
}
function joacoDay(date){
  const dow = date.getDay(); if(dow === 0 || dow === 6) return null;
  const w = weekCfg(monday(date)); const b = (S.weeks.base?.days || {})[dow] || {lleva:'dani', busca:'dani'};
  let lleva = b.lleva, busca = b.busca;
  if(w.tueNight && dow === 3 && lleva === 'gonzalo') lleva = 'dani';
  const o = (w.over || {})[dow] || {}; lleva = o.lleva || lleva; busca = o.busca || busca;
  const warn = [];
  if(!avail(lleva, dow, w).am) warn.push(`${M[lleva].n} no está a la mañana`);
  if(!avail(busca, dow, w).pm) warn.push(`${M[busca].n} no está a la tarde`);
  return {lleva, busca, warn};
}
function status(p, date){
  const dow = date.getDay(), w = weekCfg(monday(date)), out = [];
  if(p === 'gonzalo'){
    if(dow === 1) out.push('Guardia desde las 16 h');
    if(dow === 2) out.push('Sale de guardia 9 h · llega 10:30', 'Pádel a la tarde');
    if(dow === 2 && w.tueNight) out.push('Guardia de noche');
    if(dow === 3) out.push(w.tueNight ? 'Llega de guardia 9:30' : 'En casa');
    if(dow === 4) out.push('Tenis a la mañana', 'Guardia desde las 20 h');
    if(dow === 5) out.push('De guardia hasta las 20 h · llega 21:30');
    if(dow === 0 || dow === 6) out.push('En casa');
  }
  if(p === 'dani'){
    if(dow >= 1 && dow <= 5) out.push((w.office || []).includes(dow) ? 'Oficina' : 'Home office');
    if(dow === 1 || dow === 3) out.push('Posgrado a la tarde');
    if(dow === 0 || dow === 6) out.push('En casa');
  }
  return out.join(' · ');
}

      <div class="btns"><button onclick="A.perm()">Activar notificaciones</button></div>

      <h3 style="margin-top:16px">📲 App en el teléfono</h3>
      <p class="muted">${isStandalone() ? 'Ya la estás usando instalada 👌' : 'Instalala para tenerla a un toque, como cualquier app.'}</p>
      <div class="btns">${isStandalone() ? '' : `<button onclick="A.install()">Instalar app</button>`}<button onclick="A.installHelp()">Cómo instalarla</button><button onclick="A.news()">🆕 Novedades y progreso</button></div>

      <h3 style="margin-top:16px">💾 Copia de seguridad</h3>
      <div class="btns"><button onclick="A.exportJ()">Exportar</button><button onclick="document.getElementById('f_imp').click()">Importar</button><input type="file" id="f_imp" accept=".json" hidden onchange="A.importJ(this)"></div>
      <div class="btns"><button onclick="A.close()">Cerrar</button></div>
      <p class="credit">Carga Mental v${VERSION} · creada por Gonzalo Gabriel Pereira</p>`);
  },
  saveCfg(){
    try{
      const c = parseCfg($('#f_cfg').value); const code = $('#f_code').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
      if(code.length < 6) return toast('El código debe tener 6+ caracteres');
      localStorage.setItem(LS.cfg, JSON.stringify(c)); localStorage.setItem(LS.code, code);
      A.close(); toast('Conectando…'); if(fs) location.reload(); else connect();
    }catch(e){ toast('Configuración inválida: ' + e.message); }
  },
  disconnect(){ if(!confirm('¿Desconectar este teléfono de la nube? Los datos quedan guardados acá.')) return; localStorage.removeItem(LS.cfg); location.reload(); },
  invite(){
    const pay = btoa(unescape(encodeURIComponent(JSON.stringify({c:JSON.parse(localStorage.getItem(LS.cfg)), h:localStorage.getItem(LS.code)}))));
    const url = location.origin + location.pathname + '#join=' + pay;
    const t = `Te invito a *Carga Mental*, la app de la casa 🏡\nAbrí este link en Chrome y elegí quién sos:\n${url}\n\nDespués: menú ⋮ → "Agregar a pantalla principal".`;
    location.href = 'https://wa.me/?text=' + encodeURIComponent(t);
  },
  async perm(){
    if(!('Notification' in window)) return toast('Este navegador no permite avisos');
    const r = await Notification.requestPermission(); toast(r === 'granted' ? 'Avisos activados 🔔' : 'No se activaron'); A.settings();
  },
  exportJ(){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type:'application/json'})); a.download = `carga-mental-${dk()}.json`; a.click(); },
  importJ(inp){
    const f = inp.files[0]; if(!f) return; const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if(!d || typeof d !== 'object') throw 0; if(!(+d._v >= SCHEMA)){ COLS.forEach(c => d[c] = d[c] || {}); for(let v = (+d._v || 0) + 1; v <= SCHEMA; v++) MIGRATIONS[v](d); } COLS.forEach(c => { if(d[c]) Object.values(d[c]).forEach(o => { S[c][o.id] = o; if(fs) remotePath(c).doc(o.id).set(o); }); }); save(); A.close(); render(); toast('Importado ✔'); } catch(e) { toast('Archivo inválido'); } };
    r.readAsText(f);
  }
};

function vHoy(){
  const now = new Date(), j = joacoDay(now);
  let h = `<h2>Hola${me ? ', ' + esc(M[me].n) : ''} 👋</h2><p class="muted">${DOWL[now.getDay()][0].toUpperCase() + DOWL[now.getDay()].slice(1)} ${now.getDate()}/${now.getMonth()+1}</p>`;

  h += `<div class="card"><h3>📍 Hoy en casa</h3>
    <div class="item"><span>${P('gonzalo')}</span><div class="t meta">${status('gonzalo', now)}</div></div>
    <div class="item"><span>${P('dani')}</span><div class="t meta">${status('dani', now)}</div></div>
    ${j ? `<div class="item"><span>${P('joaco')}</span><div class="t meta">Lo lleva ${P(j.lleva)} · lo busca ${P(j.busca)}</div></div>${j.warn.length ? `<div class="warnbox">⚠ ${j.warn.join(' · ')}. Cambialo en la pestaña Joaco.</div>` : ''}` : ''}

  </div>`;

  // Te toca
  const todo = [];
  sorted('stores').forEach(s => { const n = Object.values(S.items).filter(i => i.store === s.id && needs(i)); if(n.length) todo.push({own:s.owner, html:`${s.icon} <b>${esc(s.name)}</b>: ${n.length} para comprar`, go:`A.filter('${s.id}');A.go('compras')`}); });
  sorted('tasks').forEach(t => {
    if(t.kind === 'rec' && recDue(t)) todo.push({own:t.owner, html:`${t.icon} ${esc(t.name)} <span class="meta">· ${ago(t.last)}</span>`, btn:`<button class="b sm" onclick="A.recDone('${t.id}')">Hecho</button>`});
    if(t.kind === 'cycle'){ const k = t.steps.findIndex((_, i) => !(t.cur || {})[i]); if(Object.keys(t.cur || {}).length) todo.push({own:t.owner, html:`${t.icon} ${esc(t.name)}: falta <b>${esc(t.steps[k].toLowerCase())}</b>`, btn:`<button class="b sm" onclick="A.step('${t.id}',${k})">${esc(t.steps[k])}</button>`}); }
  });
  Object.values(S.salud).forEach(s => {
    if(s.next && daysTo(s.next) >= 0 && daysTo(s.next) <= 7) todo.push({own:s.owner, html:`🩺 Turno ${esc(s.name)}: <b>${fdate(s.next)}</b>`});
    else if(!s.next && s.every && (!s.last || daysTo(s.last) <= -s.every)) todo.push({own:s.owner, html:`🩺 Sacar turno: ${esc(s.name)}`, go:`A.go('joaco')`});
  });
  if(j){ const c = S.checks.mochila, done = c.date === dk() ? Object.keys(c.done).length : 0; if(done < c.list.length) todo.push({own:j.lleva, html:`🎒 Mochila de Joaco ${done}/${c.list.length}`, go:`A.go('joaco')`}); }
  const pend = Object.values(S.indic).filter(n => !n.done).length;
  if(S.checks.daniela?.next && daysTo(S.checks.daniela.next) >= 0 && daysTo(S.checks.daniela.next) <= 2) todo.push({own:S.checks.daniela.coord, html:`🧹 Daniela viene ${fdate(S.checks.daniela.next)} · ${pend} indicaciones`, go:`A.go('casa')`});

  const mineL = todo.filter(x => mine(x.own)), rest = todo.filter(x => !mine(x.own));
  const row = x => `<div class="item"><div class="t" ${x.go ? `onclick="${x.go}"` : ''}>${x.html}</div>${P(x.own)}${x.btn || ''}</div>`;
  h += `<div class="card"><h3>✋ Te toca</h3>${mineL.length ? mineL.map(row).join('') : '<p class="muted">Nada pendiente para vos 🙌</p>'}</div>`;
  if(rest.length) h += `<div class="card"><h3>👀 Lo de los demás</h3>${rest.map(row).join('')}</div>`;

  if(!isStandalone() && !localStorage.getItem(LS.noInst)) h += `<div class="card install"><h3>📲 Instalá Carga Mental</h3><p class="muted">Tenela a un toque en el teléfono, con el ícono del camión.</p><div class="btns"><button class="pri" onclick="A.install()">Instalar</button><button onclick="A.installHelp()">Cómo se hace</button><button onclick="A.hideInstall()">Ahora no</button></div></div>`;

  const logs = Object.values(S.log).sort((a,b) => b.at - a.at).slice(0, 10);
  h += `<div class="card"><h3>🕑 Últimos movimientos</h3>${logs.length ? logs.map(l => `<div class="log">${P(l.by)} ${esc(l.act)} <span class="meta">· ${ago(l.at)}</span></div>`).join('') : '<p class="muted">Todavía no hay movimientos.</p>'}</div>`;
  h += verLink();
  return h;
}

      let tag = '';
      if(s.next){ const k = daysTo(s.next); tag = k < 0 ? `<span class="tag b">turno pasado: actualizá</span>` : `<span class="tag">turno ${fdate(s.next)}</span>`; }

/* ============ Render ============ */
function render(){
  const tabs = me === 'daniela'
    ? [['daniela','🧹','Indicaciones'],['chat','💬','Mensajes']]
    : [['hoy','🏠','Hoy'],['compras','🛒','Compras'],['casa','🧺','Casa'],['joaco','🧒','Joaco'],['chat','💬','Mensajes']];
  if(!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  const n = Object.values(S.items).filter(needs).length;
  $('#nav').innerHTML = tabs.map(([k, i, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="A.go('${k}')"><b>${i}</b>${l}${k === 'compras' && n ? ` (${n})` : ''}</button>`).join('');
  $('#who').innerHTML = me ? `${esc(M[me].n)} ⚙` : '⚙';
  const typing = document.activeElement && ['chatin','in_tarea','in_comida'].includes(document.activeElement.id) ? {id:document.activeElement.id, v:document.activeElement.value} : null;
  $('#main').innerHTML = ({hoy:vHoy, compras:vCompras, casa:vCasa, joaco:vJoaco, chat:vChat, daniela:() => vDaniela(false)})[tab]();
  if(typing){ const el = document.getElementById(typing.id); if(el){ el.value = typing.v; el.focus(); } }
  renderSync();
}

/* ============ Arranque ============ */
(function boot(){
  const m = location.hash.match(/#join=(.+)/);
  if(m){
    try { const j = JSON.parse(decodeURIComponent(escape(atob(m[1])))); localStorage.setItem(LS.cfg, JSON.stringify(j.c)); localStorage.setItem(LS.code, j.h); S = seed(); S._v = SCHEMA; save(); } catch(e) { console.warn(e); }
    history.replaceState(null, '', location.pathname);
  }
  // Accesos directos del ícono (manifest shortcuts): ?go=hoy | chat | anotar
  const go = new URLSearchParams(location.search).get('go');
  if(go){
    if(['hoy','compras','casa','joaco','chat'].includes(go)) tab = go;
    if(go === 'anotar') tab = 'compras';
    history.replaceState(null, '', location.pathname);
  }
  render();
  if(go === 'anotar' && me && me !== 'daniela') setTimeout(() => A.itemForm(null, storeFilter !== 'todos' ? storeFilter : 'super'), 200);
  else setTimeout(maybeNews, 1600);
  setTimeout(() => { const sp = $('#splash'); sp.classList.add('out'); setTimeout(() => sp.remove(), 600); }, 1400);
  if(!me) A.open(`<div class="welcome"><img src="cover.jpg" alt=""></div><h3>¡Bienvenido/a! 🏡</h3><p class="muted">Para que se vea quién hace qué, elegí quién usa este teléfono:</p>
    ${['gonzalo','dani','daniela'].map(p => `<button class="b" style="display:block;width:100%;margin:6px 0;text-align:left;border-left:6px solid ${M[p].c}" onclick="A.setMe('${p}')"><b>${M[p].n}</b> — ${M[p].r}</button>`).join('')}`);
  connect();
  addEventListener('online', renderSync); addEventListener('offline', renderSync);
  setInterval(() => { if(!document.querySelector('#modal:not(.hidden)') && !(document.activeElement && document.activeElement.tagName === 'INPUT')) render(); }, 60000);
  if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
